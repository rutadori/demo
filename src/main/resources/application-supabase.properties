# [학습] 기본 프로필인 supabase에서 PostgreSQL 연결 설정을 읽습니다.
# 비밀 접속값은 Git에 포함하지 않는 로컬 파일 또는 실행 환경변수로 전달합니다.
spring.config.import=optional:file:./config/supabase-local.properties
spring.datasource.url=${SUPABASE_DB_URL}
spring.datasource.username=${SUPABASE_DB_USERNAME}
spring.datasource.password=${SUPABASE_DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
# 별도 스키마를 사용하므로 같은 Supabase의 기존 public 테이블과 섞이지 않습니다.
spring.datasource.hikari.schema=house_app
# 팀원별 앱이 연결을 과도하게 점유하지 않도록 작은 풀에서 시작합니다.
spring.datasource.hikari.maximum-pool-size=4
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=15000
spring.datasource.hikari.validation-timeout=5000
# Supabase CA로 서버 인증서 체인과 호스트명을 모두 검증합니다. TLS 검증을 끄지 않습니다.
spring.datasource.hikari.data-source-properties.sslmode=verify-full
spring.datasource.hikari.data-source-properties.sslfactory=org.postgresql.ssl.LibPQFactory
spring.datasource.hikari.data-source-properties.sslrootcert=${SUPABASE_SSL_ROOT_CERT:./config/supabase-ca.crt}
spring.datasource.hikari.data-source-properties.connectTimeout=10
spring.datasource.hikari.data-source-properties.socketTimeout=30
spring.datasource.hikari.data-source-properties.ApplicationName=atsui-house-project
