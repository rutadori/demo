spring.application.name=demo
server.port=8085
# 화면 파일이 templates/Boot 아래 있으므로 뷰와 fragments/layout을 모두 이 위치에서 찾는다.
# 예: Controller의 "index" -> templates/Boot/index.html
spring.thymeleaf.prefix=classpath:/templates/Boot/
# Mapper 인터페이스의 실제 SQL XML을 읽는 경로입니다.
mybatis.mapper-locations=classpath:/mapper/*.xml
# 최초 검증 시에만 명령행에서 true로 덮어씁니다. 일반 실행·테스트에서는 외부 수집을 자동 실행하지 않습니다.
house.crawler.run-on-start=false
# 각 도시·구×출처 조합에서 저장·갱신할 최대 건수입니다. 전체 실행은 6지역의 등록된 24개 도시·구를 처리합니다.
house.crawler.max-per-source=12
# [학습] MyBatis가 사용할 DataSource의 JDBC 접속 주소(DB 서버/데이터베이스). 값은 학습 문서에 복사하지 않는다.
spring.datasource.url=jdbc:mysql://localhost:3306/exdb
# [학습] DB 접속 계정. 웹사이트 로그인 회원의 username과는 다른 정보다.
spring.datasource.username=jsl28
# [학습] DB 접속 비밀번호. 회원 비밀번호 해시와 구분하고 외부 공유 시 실제 값 노출에 주의한다.
spring.datasource.password=1234
