<!DOCTYPE html>
<!--
  [공통 레이아웃] 모든 페이지가 head·header·footer·scripts 조각을 재사용합니다.
  - templates/Boot가 Thymeleaf 기준 경로이므로 fragments/layout으로 참조합니다.
  - th:fragment는 재사용할 조각을 정의하고, th:replace는 호출 태그를 그 조각으로 교체합니다.
  - sec:authorize는 Spring Security의 실제 인증 상태에 따라 메뉴를 표시합니다.
-->
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" lang="ko">
<head th:fragment="head(title)">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="일본 부동산 매물을 한곳에서 살펴보고 원본 사이트에서 자세한 정보를 확인하세요.">
  <title th:text="${title} + ' | 니혼 하우스 찾기'">니혼 하우스 찾기</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- 정적 CSS는 static/css 아래에 두고 URL은 /css/style.css로 접근합니다. -->
  <link th:href="@{/css/style.css}" rel="stylesheet">
</head>
<body>
<header th:fragment="header" class="site-header">
  <a href="#main-content" class="skip-link">본문으로 바로가기</a>
  <nav class="navbar navbar-expand-lg navbar-light" aria-label="주 메뉴">
    <div class="container">
      <a class="navbar-brand fw-bold" th:href="@{/}"><span class="brand-icon" aria-hidden="true">⌂</span> アツイエ</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainMenu" aria-controls="mainMenu" aria-expanded="false" aria-label="메뉴 열기"><span class="navbar-toggler-icon"></span></button>
      <div class="collapse navbar-collapse" id="mainMenu">
        <ul class="navbar-nav me-auto ms-lg-4 gap-lg-3">
          <li class="nav-item"><a class="nav-link" th:href="@{/property/list}">매물 검색</a></li>
          <li class="nav-item"><a class="nav-link" th:href="@{/recommend/search}">통근·통학 추천 <span class="nav-note">준비 중</span></a></li>
          <li class="nav-item"><a class="nav-link" th:href="@{/qna}">Q&amp;A</a></li>
        </ul>
        <ul class="navbar-nav gap-lg-2">
          <li class="nav-item" sec:authorize="isAuthenticated()"><a class="nav-link" th:href="@{/manage/crawling}">수집 관리</a></li>
          <li class="nav-item" sec:authorize="isAnonymous()"><a class="nav-link" th:href="@{/test/tests}">테스트(이따가 로그인으로 돌려놓기)</a></li>
          <li class="nav-item" sec:authorize="isAnonymous()"><a class="nav-link" th:href="@{/member/join}">회원가입</a></li>
          <li class="nav-item" sec:authorize="isAuthenticated()">
            <!-- 로그아웃은 POST로 처리합니다. th:action이 CSRF 숨은 토큰을 삽입합니다. -->
            <form th:action="@{/member/logout}" method="post"><button type="submit" class="btn btn-outline-primary btn-sm my-1">로그아웃</button></form>
          </li>
        </ul>
      </div>
    </div>
  </nav>
</header>
<footer th:fragment="footer" class="site-footer">
  <div class="container"><p class="fw-semibold mb-2">アツイエ</p><p class="small text-muted mb-2">매물을 살펴본 뒤 원본 사이트에서 최신 가격과 모집 여부를 확인해 주세요.</p><p class="small text-muted mb-0">© <span th:text="${#dates.year(#dates.createNow())}">2026</span> アツイエ · 일본 부동산 매물 모아보기</p></div>
</footer>
<th:block th:fragment="scripts"><script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script></th:block>
</body>
</html>
