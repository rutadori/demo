<!DOCTYPE html>
<!--
  [매물 공통 조각] 메인·목록·선택 정보 화면이 같은 카드를 재사용합니다.
  - 사용법: ~{fragments/property-card :: card(${p})}
  - p는 이후 조회 DTO이며 DB snake_case 컬럼을 camelCase 속성으로 매핑합니다.
  - sourceName은 property_source와 JOIN해서 받는 표시용 속성입니다.
  - th:text는 제목·주소를 HTML 문자로 이스케이프하여 코드 실행을 방지합니다.
  - originalUrl은 수집 Service에서 허용 사이트 주소인지 검증해야 합니다.
    화면에서도 HTTP(S)로 시작하는 주소에만 링크를 만듭니다.
-->
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<body>
<article th:fragment="card(p)" class="card property-card h-100"
         th:with="hasLink=${p.originalUrl != null and (#strings.startsWith(p.originalUrl, 'https://') or #strings.startsWith(p.originalUrl, 'http://'))}">
  <!-- 이미지가 없거나 실패하면 기본 배경을 표시합니다. 사진은 배경 위를 덮도록 CSS로 배치합니다. -->
  <div class="photo-box"><span aria-hidden="true">⌂</span><small>사진 준비 중</small>
    <img th:if="${p.imageUrl != null and (#strings.startsWith(p.imageUrl, 'https://') or #strings.startsWith(p.imageUrl, 'http://'))}" th:src="${p.imageUrl}" th:alt="${p.title}" loading="lazy" onerror="this.hidden=true">
  </div>
  <div class="card-body d-flex flex-column">
    <span class="source-label" th:text="${#strings.isEmpty(p.sourceName) ? '출처 정보 없음' : p.sourceName}">출처</span>
    <h3 class="h5 mt-3 mb-2">
      <!-- stretched-link는 클릭 영역을 카드 전체로 넓힙니다. 링크는 내부 상세가 아닌 원본입니다. -->
      <a th:if="${hasLink}" th:href="${p.originalUrl}" class="stretched-link property-title" target="_blank" rel="noopener noreferrer" th:attr="aria-label=${p.title + ' · 원본 사이트에서 보기 (새 탭)'}" th:text="${p.title}">매물 제목</a>
      <span th:unless="${hasLink}" th:text="${p.title}">매물 제목</span>
    </h3>
    <!-- NULL(정보 없음)과 0엔(실제 비용 없음)을 구분합니다. -->
    <p class="price mb-1" th:text="${p.rentYen == null ? '월세 정보 없음' : '¥' + #numbers.formatInteger(p.rentYen, 1, 'COMMA') + ' / 월'}">월세</p>
    <p class="small text-muted" th:text="${p.managementFeeYen == null ? '관리비 미표시' : '관리비 ¥' + #numbers.formatInteger(p.managementFeeYen, 1, 'COMMA')}">관리비</p>
    <p class="small text-muted mb-2" th:text="${#strings.isEmpty(p.address) ? '주소 미표시' : p.address}">주소</p>
    <div class="property-specs mb-3"><span th:text="${#strings.isEmpty(p.layout) ? '구조 미표시' : p.layout}">방 구조</span><span th:text="${p.areaM2 == null ? '면적 미표시' : p.areaM2 + '㎡'}">면적</span></div>
    <p class="small text-muted mb-3"><span th:text="${#strings.isEmpty(p.stationName) ? '역 정보 미표시' : p.stationName}">가까운 역</span><span th:if="${p.walkMinutes != null}" th:text="${' · 도보 ' + p.walkMinutes + '분'}"></span></p>
    <div class="card-bottom mt-auto"><span th:if="${hasLink}">원본 매물 보기 ↗ <small class="text-muted">새 탭</small></span><span th:unless="${hasLink}" class="text-muted">원본 링크 준비 중</span></div>
  </div>
</article>
<!-- 호출하는 화면에서 빈 상태의 제목·설명을 전달합니다. -->
<div th:fragment="empty(title, message)" class="empty-state" role="status"><div class="empty-icon" aria-hidden="true">⌂</div><h3 class="h5" th:text="${title}">표시할 매물이 없습니다</h3><p class="text-muted mb-0" th:text="${message}">조건을 변경해 주세요.</p></div>
</body>
</html>
