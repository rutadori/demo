<!DOCTYPE html>
<!--
  [로그인] GET은 PageController, POST는 Spring Security가 처리합니다.
  - username·password라는 name이 Security 기본 인증 필드와 일치해야 합니다.
  - th:action을 사용하면 POST 폼에 CSRF 토큰이 자동으로 삽입됩니다.
-->
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head th:replace="~{fragments/layout :: head('로그인')}"></head>
<body>
<header th:replace="~{fragments/layout :: header}"></header>
<main id="main-content" class="container page-section">
  <div class="auth-panel">
    <p class="eyebrow">니혼 하우스 찾기</p><h1 class="h2 mb-2">다시 만나 반가워요</h1><p class="text-muted mb-4">매물 검색은 로그인 없이도 이용할 수 있어요.</p>
    <div class="alert alert-danger" th:if="${param.error}" role="alert">아이디 또는 비밀번호가 올바르지 않습니다.</div>
    <div class="alert alert-success" th:if="${param.logout}" role="status">로그아웃되었습니다.</div>
    <form th:action="@{/member/login}" method="post">
      <div class="mb-3"><label for="username" class="form-label">아이디</label><input id="username" type="text" name="username" class="form-control" autocomplete="username" required></div>
      <div class="mb-4"><label for="password" class="form-label">비밀번호</label><input id="password" type="password" name="password" class="form-control" autocomplete="current-password" required></div>
      <button type="submit" class="btn btn-primary w-100">로그인</button>
    </form>
    <details class="learning-note mt-4"><summary>학습용 로그인 안내</summary><p class="small text-muted mt-2 mb-0">회원 DB 연동 전입니다. 아이디는 <strong>user</strong>, 비밀번호는 서버 실행 콘솔의 <code>Using generated security password</code> 값을 사용하세요.</p></details>
    <div class="d-flex justify-content-between gap-3 mt-4 small"><a th:href="@{/property/list}" class="text-link">로그인 없이 둘러보기</a><a th:href="@{/member/join}" class="text-link">회원가입 안내</a></div>
  </div>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
