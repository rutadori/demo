<!DOCTYPE html>
<!--
  [통근·통학 추천 준비 화면] /recommend/search, 기존 /recommend/result 주소를 지원합니다.
  - 지도·경로 추천을 아직 구현하지 않았으므로 가짜 역·시간·매물 결과를 표시하지 않습니다.
  - fieldset disabled는 내부 입력과 제출을 비활성화하여 미구현 기능이 실행되는 것을 막습니다.
  - 실제 기능을 작성할 때 검증 DTO·Service·Controller와 연결한 뒤 활성화합니다.
-->
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head th:replace="~{fragments/layout :: head('통근·통학 추천')}"></head>
<body>
<header th:replace="~{fragments/layout :: header}"></header>
<main id="main-content" class="container page-section">
  <div class="page-heading"><span class="badge text-bg-light mb-3">준비 중</span><h1>회사·학교에서 가까운 집</h1><p class="text-muted mb-0">다니는 곳까지의 이동 시간을 기준으로 집을 찾는 기능을 준비하고 있어요.</p></div>
  <!-- 통근·통학을 표현하는 두 번째 원본 이미지입니다. 기능 준비 안내와 추천 폼은 아래에서 이어집니다. -->
  <figure class="page-artwork commute-artwork">
    <img th:src="@{/images/commute-study-hero.png}" width="1920" height="819" fetchpriority="high" decoding="async"
         alt="벚꽃이 핀 지하철역과 대학을 배경으로 출근과 등교를 하는 모습">
  </figure>
  <section class="feature-notice mb-4" aria-label="이용 안내"><div><h2 class="h5">지금은 지역과 역 이름으로 찾아보세요</h2><p class="text-muted mb-0">매물 검색 화면에서 지역, 월세, 역까지의 도보 조건을 선택할 수 있어요.</p></div><a th:href="@{/property/list}" class="btn btn-primary">매물 검색으로</a></section>
  <section class="form-panel" aria-labelledby="recommend-heading">
    <h2 id="recommend-heading" class="h5 mb-2">이렇게 찾을 수 있도록 준비하고 있어요</h2><p class="text-muted small mb-4" id="recommend-note">아래 입력 영역은 미리보기이며 현재 추천 요청은 전송되지 않습니다.</p>
    <form><fieldset disabled aria-describedby="recommend-note"><div class="row g-3">
      <div class="col-md-3"><label for="placeType" class="form-label">목적지 구분</label><select id="placeType" name="placeType" class="form-select"><option value="company">회사</option><option value="school">학교</option></select></div>
      <div class="col-md-5"><label for="placeName" class="form-label">회사 · 학교 이름</label><input id="placeName" type="text" name="placeName" class="form-control" placeholder="회사 또는 학교 이름"></div>
      <div class="col-md-4"><label for="commuteMinutes" class="form-label">최대 통근·통학 시간</label><select id="commuteMinutes" name="commuteMinutes" class="form-select"><option value="20">20분 이내</option><option value="30">30분 이내</option><option value="45">45분 이내</option><option value="60">60분 이내</option></select></div>
    </div><button type="button" class="btn btn-secondary mt-4" disabled>추천 기능 준비 중</button></fieldset></form>
  </section>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
